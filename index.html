  <!DOCTYPE html>
  <html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minna no Nihongo I — Hành Trình Chinh Phục Phú Sĩ</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e2b4d'/%3E%3Cpolygon points='8,48 32,14 56,48' fill='%23334b7a'/%3E%3Cpolygon points='23,26.8 32,14 41,26.8 36,24.5 32,28.5 28,24.5' fill='%23ffffff'/%3E%3C/svg%3E">
    <!-- Google Fonts với danh sách font dự phòng khi offline -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet" />

    <style>
      /* ==========================================================================
        1. DESIGN TOKENS & BIẾN THEME (SÁNG: BÌNH MINH / TỐI: ĐÊM TUYẾT)
        ========================================================================== */
      :root {
        --font-serif: 'Noto Serif JP', 'Times New Roman', Georgia, serif;
        --font-sans: 'Be Vietnam Pro', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        /* Theme Sáng (Mặc định - Bình minh Phú Sĩ) */
        --sky-top: #5d7ea6;
        --sky-mid: #e6a89c;
        --sky-bottom: #f9e4c8;
        --sun-color: #d93829;
        --fuji-dark: #2c4268;
        --fuji-light: #415d8c;
        --snow-cap: #ffffff;
        --hill-1: #364f6b;
        --hill-2: #24364d;
        --mist-color: rgba(255, 245, 235, 0.55);

        /* Giao diện thẻ kính mờ */
        --card-bg: rgba(255, 255, 255, 0.84);
        --card-bg-elevated: rgba(255, 255, 255, 0.94);
        --card-border: rgba(44, 66, 104, 0.16);
        --card-shadow: 0 10px 30px rgba(24, 38, 64, 0.12);

        /* Chữ & Điểm nhấn */
        --text-primary: #162238;
        --text-secondary: #3d4f6f;
        --text-muted: #627391;
        --indigo-primary: #264373;
        --indigo-hover: #1b3156;
        --torii-red: #c9372c;
        --torii-red-hover: #a8281e;
        --success-color: #15803d;
        --success-bg: rgba(21, 128, 61, 0.12);
        --error-color: #b91c1c;
        --error-bg: rgba(185, 28, 28, 0.12);
        --badge-bg: rgba(38, 67, 115, 0.1);
      }

      [data-theme="dark"] {
        /* Theme Tối (Đêm tuyết Phú Sĩ) */
        --sky-top: #070b14;
        --sky-mid: #101d36;
        --sky-bottom: #1b3154;
        --sun-color: #f4f1de; /* Mặt trăng mờ */
        --fuji-dark: #131f38;
        --fuji-light: #22355c;
        --snow-cap: #e2e8f0;
        --hill-1: #0e1729;
        --hill-2: #080e1a;
        --mist-color: rgba(27, 49, 84, 0.45);

        /* Giao diện thẻ kính mờ tối */
        --card-bg: rgba(15, 24, 42, 0.80);
        --card-bg-elevated: rgba(22, 34, 58, 0.92);
        --card-border: rgba(226, 232, 240, 0.15);
        --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);

        /* Chữ & Điểm nhấn */
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --indigo-primary: #60a5fa;
        --indigo-hover: #93c5fd;
        --torii-red: #ef4444;
        --torii-red-hover: #f87171;
        --success-color: #4ade80;
        --success-bg: rgba(74, 222, 128, 0.15);
        --error-color: #f87171;
        --error-bg: rgba(248, 113, 113, 0.15);
        --badge-bg: rgba(96, 165, 250, 0.15);
      }

      /* ==========================================================================
        2. RESET & CƠ BẢN
        ========================================================================== */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        min-height: 100vh;
        font-family: var(--font-sans);
        color: var(--text-primary);
        background-color: var(--sky-top);
        overflow-x: hidden;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      button, input, select {
        font-family: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        border: none;
        background: none;
        transition: all 0.2s ease;
      }

      button:focus-visible, input:focus-visible, select:focus-visible {
        outline: 2px solid var(--torii-red);
        outline-offset: 2px;
      }

      ruby {
        ruby-align: center;
      }

      rt {
        font-size: 0.55em;
        color: var(--text-secondary);
        font-weight: 400;
        user-select: none;
      }

      body.hide-furigana rt {
        visibility: hidden;
      }

      .jp-text {
        font-family: 'Noto Sans JP', var(--font-sans);
      }

      .serif-title {
        font-family: var(--font-serif);
      }

      /* ==========================================================================
        3. NỀN NÚI PHÚ SĨ & HIỆU ỨNG TUYẾT RƠI
        ========================================================================== */
      #fuji-backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 58%, var(--sky-bottom) 100%);
        transition: background 0.6s ease;
        overflow: hidden;
        pointer-events: none;
      }

      #stars-layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.8s ease;
      }

      [data-theme="dark"] #stars-layer {
        opacity: 1;
      }

      .star {
        position: absolute;
        background: #ffffff;
        border-radius: 50%;
        animation: twinkle var(--dur, 4s) infinite ease-in-out alternate;
      }

      @keyframes twinkle {
        0% { opacity: 0.15; transform: scale(0.85); }
        100% { opacity: 0.9; transform: scale(1.15); }
      }

      #fuji-svg {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        min-width: 900px;
        height: 100%;
        max-height: 100vh;
      }

      .parallax-layer {
        transition: transform 0.15s ease-out;
        will-change: transform;
      }

      @media (prefers-reduced-motion: reduce) {
        .parallax-layer {
          transform: none !important;
        }
        .star {
          animation: none !important;
        }
      }

      #snow-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      /* ==========================================================================
        4. BỐ CỤC CHÍNH (APP SHELL)
        ========================================================================== */
      #app-wrapper {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        max-width: 1360px;
        margin: 0 auto;
        padding: 12px 16px 84px; /* Chừa đáy cho bottom nav trên mobile */
      }

      @media (min-width: 900px) {
        #app-wrapper {
          padding: 16px 24px 28px;
        }
      }

      /* Thẻ kính mờ chuẩn */
      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        box-shadow: var(--card-shadow);
      }

      /* Thanh trên cùng (Header) */
      .top-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 18px;
        margin-bottom: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--torii-red);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: 1.25rem;
        box-shadow: 0 4px 12px rgba(201, 55, 44, 0.35);
      }

      .brand-text h1 {
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1.2;
      }

      .brand-text span {
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .search-box {
        position: relative;
        flex: 1 1 220px;
        max-width: 380px;
      }

      .search-box input {
        width: 100%;
        padding: 9px 14px 9px 36px;
        border-radius: 12px;
        border: 1px solid var(--card-border);
        background: var(--card-bg-elevated);
        font-size: 0.9rem;
      }

      .search-box svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--text-muted);
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 12px;
        background: var(--card-bg-elevated);
        border: 1px solid var(--card-border);
        font-size: 0.85rem;
        font-weight: 500;
        min-height: 38px;
      }

      .icon-btn:hover {
        border-color: var(--indigo-primary);
      }

      /* Thanh cảnh báo TTS nếu thiếu giọng tiếng Nhật */
      #tts-warning {
        display: none;
        padding: 10px 16px;
        margin-bottom: 14px;
        border-radius: 14px;
        background: var(--error-bg);
        border: 1px solid var(--error-color);
        color: var(--text-primary);
        font-size: 0.88rem;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      /* Lưới nội dung chính: Sidebar (Desktop) + Main Content */
      .workspace {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        flex: 1;
      }

      @media (min-width: 900px) {
        .workspace {
          grid-template-columns: 270px 1fr;
          align-items: start;
        }
      }

      /* Sidebar Desktop */
      .sidebar {
        display: none;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        position: sticky;
        top: 16px;
        max-height: calc(100vh - 110px);
      }

      @media (min-width: 900px) {
        .sidebar {
          display: flex;
        }
      }

      .nav-group-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        font-weight: 700;
        margin-bottom: 4px;
      }

      .nav-btn {
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.92rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .nav-btn:hover {
        background: var(--badge-bg);
        color: var(--text-primary);
      }

      .nav-btn.active {
        background: var(--indigo-primary);
        color: #ffffff;
        font-weight: 600;
      }

      [data-theme="dark"] .nav-btn.active {
        color: #0b1324;
      }

      .lesson-scroll-list {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-right: 4px;
        max-height: 48vh;
      }

      .lesson-item-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 0.88rem;
        text-align: left;
        width: 100%;
      }

      .lesson-item-btn:hover:not(:disabled) {
        background: var(--badge-bg);
      }

      .lesson-item-btn.active {
        background: var(--torii-red);
        color: #fff;
        font-weight: 600;
      }

      .lesson-item-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .lesson-num-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 24px;
        border-radius: 7px;
        background: var(--badge-bg);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .lesson-item-btn.active .lesson-num-badge {
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
      }

      /* Thanh điều hướng dưới cùng cho Mobile */
      .mobile-bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        justify-content: space-around;
        padding: 6px 4px;
        background: var(--card-bg-elevated);
        backdrop-filter: blur(16px);
        border-top: 1px solid var(--card-border);
      }

      @media (min-width: 900px) {
        .mobile-bottom-nav {
          display: none;
        }
      }

      .mobile-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 6px 8px;
        border-radius: 10px;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-secondary);
        min-width: 60px;
      }

      .mobile-nav-item.active {
        color: var(--torii-red);
      }

      /* Khu vực nội dung chính */
      .main-stage {
        padding: 20px;
        min-height: 70vh;
        animation: fadeSlideIn 0.22s ease-out;
      }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ==========================================================================
        5. CÁC THÀNH PHẦN GIAO DIỆN HỌC TẬP
        ========================================================================== */
      .btn-primary {
        background: var(--torii-red);
        color: #ffffff;
        padding: 10px 18px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.92rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-shadow: 0 4px 12px rgba(201, 55, 44, 0.25);
      }

      .btn-primary:hover {
        background: var(--torii-red-hover);
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: var(--badge-bg);
        color: var(--text-primary);
        padding: 8px 14px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.88rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .btn-secondary:hover {
        background: var(--indigo-primary);
        color: #fff;
      }

      [data-theme="dark"] .btn-secondary:hover {
        color: #0b1324;
      }

      /* Sub-tabs trong bài học */
      .sub-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 8px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--card-border);
      }

      .sub-tab {
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 0.88rem;
        font-weight: 600;
        white-space: nowrap;
        color: var(--text-secondary);
        background: transparent;
      }

      .sub-tab.active {
        background: var(--indigo-primary);
        color: #ffffff;
      }

      [data-theme="dark"] .sub-tab.active {
        color: #0b1324;
      }

      /* Thẻ từ vựng & Flashcard */
      .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }

      .vocab-card {
        background: var(--card-bg-elevated);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;
      }

      .vocab-card.mastered {
        border-color: var(--success-color);
        background: linear-gradient(135deg, var(--card-bg-elevated), var(--success-bg));
      }

      .vocab-jp {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .vocab-romaji {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-style: italic;
      }

      .vocab-vi {
        font-size: 0.98rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .tag-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 600;
        background: var(--badge-bg);
        color: var(--indigo-primary);
      }

      /* Flashcard lật */
      .flashcard-stage {
        perspective: 1000px;
        max-width: 460px;
        margin: 20px auto;
      }

      .flashcard-inner {
        position: relative;
        width: 100%;
        min-height: 240px;
        transition: transform 0.5s;
        transform-style: preserve-3d;
        cursor: pointer;
      }

      .flashcard-inner.flipped {
        transform: rotateY(180deg);
      }

      .flashcard-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: var(--card-bg-elevated);
        border: 2px solid var(--card-border);
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: var(--card-shadow);
      }

      .flashcard-back {
        transform: rotateY(180deg);
        border-color: var(--indigo-primary);
      }

      /* Hội thoại bong bóng chat */
      .chat-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .chat-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .avatar-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      }

      .chat-bubble {
        background: var(--card-bg-elevated);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        border-top-left-radius: 4px;
        padding: 12px 16px;
        flex: 1;
      }

      .shadowing-blur .jp-line {
        filter: blur(7px);
        user-select: none;
        transition: filter 0.2s;
      }

      .shadowing-blur .jp-line:hover,
      .shadowing-blur .jp-line:active {
        filter: none;
      }

      /* Ngữ pháp */
      .grammar-card {
        background: var(--card-bg-elevated);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 16px;
      }

      .grammar-formula {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--torii-red);
        margin-bottom: 4px;
      }

      /* Luyện tập & Quiz */
      .quiz-option {
        width: 100%;
        text-align: left;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1.5px solid var(--card-border);
        background: var(--card-bg-elevated);
        margin-bottom: 8px;
        font-size: 0.98rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .quiz-option:hover:not(:disabled) {
        border-color: var(--indigo-primary);
      }

      .quiz-option.correct {
        border-color: var(--success-color);
        background: var(--success-bg);
        font-weight: 600;
      }

      .quiz-option.wrong {
        border-color: var(--error-color);
        background: var(--error-bg);
      }

      .word-bank {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 48px;
        padding: 10px;
        border-radius: 12px;
        border: 1.5px dashed var(--card-border);
        background: var(--card-bg);
        margin-bottom: 12px;
      }

      .word-chip {
        padding: 8px 14px;
        border-radius: 10px;
        background: var(--indigo-primary);
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
      }

      [data-theme="dark"] .word-chip {
        color: #0b1324;
      }

      /* Bảng chữ cái Kana theo format thẻ chữ kép */
      .kana-section-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 20px 0 10px;
        font-size: 0.98rem;
        font-weight: 700;
      }

      .kana-section-title {
        color: var(--torii-red);
      }

      .kana-section-pct {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 600;
      }

      .kana-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 10px;
      }

      .kana-grid.yoon-grid {
        grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      }

      @media (min-width: 640px) {
        .kana-grid {
          grid-template-columns: repeat(5, 1fr);
        }

        .kana-grid.yoon-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .kana-cell {
        min-height: 86px;
        border-radius: 14px;
        background: var(--card-bg-elevated);
        border: 1.5px solid var(--card-border);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 8px;
        gap: 3px;
        position: relative;
      }

      .kana-cell:hover:not(.empty) {
        border-color: var(--torii-red);
        transform: translateY(-2px);
      }

        learnedKana: {},   // key: "hira-あ" hoặc "kata-ア" -> true
        leitnerBoxes: {},  // key: "1-わたし" -> 1..5
        completedLessons: [], // [1, 2, ...]
        quizStats: { total: 0, correct: 0, streak: 0 },
        studyDays: [new Date().toISOString().slice(0, 10)]
      };

      let state = { ...DEFAULT_STATE };
      let storageAvailable = true;

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            state = { ...DEFAULT_STATE, ...parsed };
          }
          // Cập nhật chuỗi ngày học
          const today = new Date().toISOString().slice(0, 10);
          if (!state.studyDays.includes(today)) {
            state.studyDays.push(today);
          }
        } catch (e) {
          storageAvailable = false;
          console.warn("Không thể truy cập localStorage, dùng bộ nhớ tạm:", e);
        }
      }

      function saveState() {
        if (!storageAvailable) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          storageAvailable = false;
        }
      }

      // Hệ thống SRS Leitner 5 hộp
      function updateLeitner(vocabKey, isCorrect) {
        const currentBox = state.leitnerBoxes[vocabKey] || 1;
        if (isCorrect) {
          const nextBox = Math.min(5, currentBox + 1);
          state.leitnerBoxes[vocabKey] = nextBox;
          if (nextBox >= 4) state.masteredVocab[vocabKey] = true;
        } else {
          state.leitnerBoxes[vocabKey] = 1; // Sai trả về hộp 1 để ưu tiên ôn
          delete state.masteredVocab[vocabKey];
        }
        saveState();
      }

      function getVocabKey(lessonNum, jp) {
        return `${lessonNum}-${jp}`;
      }

      /* ==========================================================================
        MODULE 3: ÂM THANH WEB SPEECH API (ja-JP)
        ========================================================================== */
      let jaVoices = [];
      let ttsChecked = false;

      function initVoices() {
        if (!("speechSynthesis" in window)) return;
        const update = () => {
          const all = window.speechSynthesis.getVoices();
          jaVoices = all.filter(v => v.lang && v.lang.toLowerCase().includes("ja"));
          if (all.length > 0 && jaVoices.length === 0 && !ttsChecked) {
            ttsChecked = true;
            document.getElementById("tts-warning").style.display = "flex";
          }
        };
        update();
        window.speechSynthesis.onvoiceschanged = update;
      }

      function speakJapanese(text, speakerName = "") {
        if (!("speechSynthesis" in window)) {
          document.getElementById("tts-warning").style.display = "flex";
          return;
        }
        window.speechSynthesis.cancel();
        // Làm sạch ký tự chú thích trước khi đọc
        const cleanText = text.replace(/（.*?）/g, "").replace(/\(.*?\)/g, "").replace(/～/g, "");
        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.lang = "ja-JP";
        utter.rate = 0.85;

        if (jaVoices.length > 0) {
          // Phân biệt giọng theo nhân vật nếu có nhiều giọng hoặc chỉnh pitch nhẹ
          const hash = speakerName.split("").reduce((acc, c) => acc + c.charCodeAt(0), 0);
          utter.voice = jaVoices[hash % jaVoices.length];
          if (speakerName) {
            const isFemale = /Sato|Maria|Karina|Tomoko|Izumi|Teresa/i.test(speakerName);
            utter.pitch = isFemale ? 1.15 : 0.92;
          }
        } else {
          document.getElementById("tts-warning").style.display = "flex";
        }

        window.speechSynthesis.speak(utter);
      }

      function speakDialogueSequence(lines) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        let idx = 0;
        function nextLine() {
          if (idx >= lines.length) return;
          const line = lines[idx++];
          const cleanText = line.jp.replace(/（.*?）/g, "").replace(/\(.*?\)/g, "");
          const utter = new SpeechSynthesisUtterance(cleanText);
          utter.lang = "ja-JP";
          utter.rate = 0.85;
          if (jaVoices.length > 0) {
            const hash = line.who.split("").reduce((acc, c) => acc + c.charCodeAt(0), 0);
            utter.voice = jaVoices[hash % jaVoices.length];
            utter.pitch = /Sato|Maria|Karina|Tomoko|Izumi|Teresa/i.test(line.who) ? 1.15 : 0.92;
          }
          utter.onend = () => setTimeout(nextLine, 350);
          window.speechSynthesis.speak(utter);
        }
        nextLine();
      }

      /* ==========================================================================
        MODULE 4: CHUYỂN ĐỔI ROMAJI CƠ BẢN (HIỂN THỊ KHI BẬT ROMAJI)
        ========================================================================== */
      const KANA_ROMAJI_MAP = {
        "あ":"a","い":"i","う":"u","え":"e","お":"o","か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",
        "さ":"sa","し":"shi","す":"su","せ":"se","そ":"so","た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",
        "な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no","は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",
        "ま":"ma","み":"mi","む":"mu","め":"me","も":"mo","や":"ya","ゆ":"yu","よ":"yo",
        "ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro","わ":"wa","を":"o","ん":"n",
        "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go","ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",
        "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do","ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",
        "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",
        "きゃ":"kya","きゅ":"kyu","きょ":"kyo","しゃ":"sha","しゅ":"shu","しょ":"sho",
        "ちゃ":"cha","ちゅ":"chu","ちょ":"cho","にゃ":"nya","にゅ":"nyu","にょ":"nyo",
        "ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo","みゃ":"mya","みゅ":"myu","みょ":"myo",
        "りゃ":"rya","りゅ":"ryu","りょ":"ryo","ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo",
        "じゃ":"ja","じゅ":"ju","じょ":"jo","びゃ":"bya","びゅ":"byu","びょ":"byo",
        "ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo",
        "ア":"a","イ":"i","ウ":"u","エ":"e","オ":"o","カ":"ka","キ":"ki","ク":"ku","ケ":"ke","コ":"ko",
        "サ":"sa","シ":"shi","ス":"su","セ":"se","ソ":"so","タ":"ta","チ":"chi","ツ":"tsu","テ":"te","ト":"to",
        "ナ":"na","ニ":"ni","ヌ":"nu","ネ":"ne","ノ":"no","ハ":"ha","ヒ":"hi","フ":"fu","ヘ":"he","ホ":"ho",
        "マ":"ma","ミ":"mi","ム":"mu","メ":"me","モ":"mo","ヤ":"ya","ユ":"yu","ヨ":"yo",
        "ラ":"ra","リ":"ri","ル":"ru","レ":"re","ロ":"ro","ワ":"wa","ヲ":"o","ン":"n",
        "ガ":"ga","ギ":"gi","グ":"gu","ゲ":"ge","ゴ":"go","ザ":"za","ジ":"ji","ズ":"zu","ゼ":"ze","ゾ":"zo",
        "ダ":"da","ヂ":"ji","ヅ":"zu","デ":"de","ド":"do","バ":"ba","ビ":"bi","ブ":"bu","ベ":"be","ボ":"bo",
        "パ":"pa","ピ":"pi","プ":"pu","ペ":"pe","ポ":"po","ー":"-"
      };

      function toRomaji(kanaStr) {
        let res = "";
        for (let i = 0; i < kanaStr.length; i++) {
          const two = kanaStr.slice(i, i + 2);
          if (KANA_ROMAJI_MAP[two]) {
            res += KANA_ROMAJI_MAP[two];
            i++;
          } else if (kanaStr[i] === "っ" || kanaStr[i] === "ッ") {
            const next = KANA_ROMAJI_MAP[kanaStr[i + 1]] || "";
            if (next) res += next[0];
          } else {
            res += KANA_ROMAJI_MAP[kanaStr[i]] || kanaStr[i];
          }
        }
        return res;
      }

      function renderJpWithFurigana(jp, kanji) {
        if (!kanji) return `<span class="jp-text">${jp}</span>`;
        return `<ruby class="jp-text">${kanji}<rt>${jp}</rt></ruby>`;
      }

      /* ==========================================================================
        MODULE 5: ENGINE TỰ SINH BÀI TẬP & KIỂM TRA (GIỚI HẠN KIẾN THỨC ≤ BÀI N)
        ========================================================================== */
      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      // Lấy toàn bộ dữ liệu từ Bài 1 đến Bài maxLesson
      function getPoolUpToLesson(maxLesson) {
        const available = LESSONS.filter(l => l.n <= maxLesson);
        const vocabPool = [];
        const patternPool = [];
        const examplePool = [];

        available.forEach(lesson => {
          lesson.vocab.forEach(v => {
            vocabPool.push({ ...v, lessonN: lesson.n, key: getVocabKey(lesson.n, v.jp) });
          });
          lesson.patterns.forEach(p => {
            patternPool.push({ ...p, lessonN: lesson.n });
            p.examples.forEach(ex => {
              examplePool.push({ ...ex, patternId: p.id, formula: p.formula, lessonN: lesson.n });
            });
          });
        });

        // Ưu tiên từ vựng ở hộp Leitner thấp (sai nhiều / chưa thuộc)
        vocabPool.sort((a, b) => (state.leitnerBoxes[a.key] || 1) - (state.leitnerBoxes[b.key] || 1));

        return { vocabPool, patternPool, examplePool };
      }

      function generatePracticeQuestions(maxLesson, count = 8, focusPatternId = null) {
        const { vocabPool, patternPool, examplePool } = getPoolUpToLesson(maxLesson);
        const questions = [];

        if (vocabPool.length < 4) return questions;

        for (let i = 0; i < count; i++) {
          const qType = focusPatternId ? (i % 2 === 0 ? "particle" : "reorder") : ["jp2vi", "vi2jp", "audio", "particle", "reorder", "translate"][i % 6];

          if (qType === "jp2vi" || qType === "vi2jp" || qType === "audio") {
            const target = vocabPool[i % Math.min(vocabPool.length, 15)];
            const distractors = shuffleArray(vocabPool.filter(v => v.jp !== target.jp)).slice(0, 3);
            const choices = shuffleArray([target, ...distractors]);

            if (qType === "jp2vi") {
              questions.push({
                type: "choice",
                prompt: `Nghĩa của từ 「${target.kanji || target.jp}」 (${target.jp}) là gì?`,
                audioText: target.jp,
                options: choices.map(c => c.vi),
                answer: target.vi,
                vocabKey: target.key,
                explain: `Bài ${target.lessonN} — Từ vựng: ${target.kanji || target.jp} (${target.jp}) = ${target.vi}.`
              });
            } else if (qType === "vi2jp") {
              questions.push({
                type: "choice",
                prompt: `Từ tiếng Nhật nào có nghĩa là: "${target.vi}"?`,
                options: choices.map(c => c.kanji ? `${c.kanji} (${c.jp})` : c.jp),
                answer: target.kanji ? `${c.kanji} (${c.jp})` : c.jp,
                vocabKey: target.key,
                explain: `Bài ${target.lessonN} — Từ vựng: "${target.vi}" là ${target.kanji || target.jp}.`
              });
            } else {
              questions.push({
                type: "choice",
                prompt: `🔊 Nghe phát âm và chọn từ đúng:`,
                audioText: target.jp,
                autoPlay: true,
                options: choices.map(c => `${c.jp} — ${c.vi}`),
                answer: `${c.jp} — ${c.vi}`,
                vocabKey: target.key,
                explain: `Bài ${target.lessonN} — Âm thanh đọc là 「${target.jp}」 (${target.vi}).`
              });
            }
          } else if (qType === "particle") {
            // Tìm câu ví dụ có trợ từ cơ bản (は, も, の, か, を, に, へ, で, が)
            const filteredEx = focusPatternId ? examplePool.filter(e => e.patternId === focusPatternId) : examplePool;
            const pool = filteredEx.length > 0 ? filteredEx : examplePool;
            const ex = pool[i % pool.length];
            const particles = ["は", "も", "の", "か", "を", "に", "へ", "で", "が"];
            let foundP = null;
            let blankSentence = ex.jp;

            for (const p of particles) {
              const regex = new RegExp(`(?<=[^\\s])${p}(?=\\s|。|、|$)`);
              if (regex.test(ex.jp)) {
                foundP = p;
                blankSentence = ex.jp.replace(regex, " [ ___ ] ");
                break;
              }
            }

            if (foundP) {
              const opts = shuffleArray([foundP, ...shuffleArray(particles.filter(x => x !== foundP)).slice(0, 3)]);
              questions.push({
                type: "choice",
                prompt: `Điền trợ từ thích hợp vào chỗ trống:\n「${blankSentence}」\n(${ex.vi})`,
                options: opts,
                answer: foundP,
                explain: `Bài ${ex.lessonN}, điểm ngữ pháp ${ex.patternId} (${ex.formula}): Câu đầy đủ là 「${ex.jp}」.`
              });
            } else {
              i--; // Thử dạng khác
              continue;
            }
          } else if (qType === "reorder") {
            const filteredEx = focusPatternId ? examplePool.filter(e => e.patternId === focusPatternId) : examplePool;
            const pool = filteredEx.length > 0 ? filteredEx : examplePool;
            const ex = pool[i % pool.length];
            const clean = ex.jp.replace(/。/g, "").trim();
            const tokens = clean.split(/\s+/);
            if (tokens.length >= 2) {
              questions.push({
                type: "reorder",
                prompt: `Sắp xếp các từ sau thành câu tiếng Nhật đúng nghĩa:\n"${ex.vi}"`,
                tokens: shuffleArray(tokens),
                answerTokens: tokens,
                answerText: clean,
                explain: `Bài ${ex.lessonN}, điểm ngữ pháp ${ex.patternId} (${ex.formula}): 「${ex.jp}」.`
              });
            } else {
              i--;
            }
          } else {
            // Dịch Việt -> Nhật chọn đáp án
            const ex = examplePool[i % examplePool.length];
            const distractors = shuffleArray(examplePool.filter(e => e.jp !== ex.jp)).slice(0, 3);
            const choices = shuffleArray([ex, ...distractors]);
            questions.push({
              type: "choice",
              prompt: `Chọn câu tiếng Nhật dịch đúng ý sau:\n"${ex.vi}"`,
              options: choices.map(c => c.jp),
              answer: ex.jp,
              explain: `Bài ${ex.lessonN}, điểm ngữ pháp ${ex.patternId} (${ex.formula}).`
            });
          }
        }
        return questions;
      }

      /* ==========================================================================
        MODULE 6: GIAO DIỆN & RENDER CÁC MÀN HÌNH
        ========================================================================== */
      const mainEl = document.getElementById("main-content");

      function renderNavigation() {

        const mobileList = document.getElementById("mobile-lesson-list");

        const html = LESSON_TITLES.map(item => {

          return `
            <button class="lesson-item-btn ${isActive ? "active" : ""}"
                    ${!loaded ? "disabled title='Đang chờ nạp dữ liệu ở giai đoạn tiếp theo'" : ""}
                    onclick="selectLesson(${item.n})">
              <span class="lesson-num-badge">${isDone ? "✓" : item.n}</span>
              <span style="flex:1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">

        document.querySelectorAll("[data-view]").forEach(btn => {
          btn.classList.toggle("active", btn.getAttribute("data-view") === state.currentView);

        saveState();
        renderNavigation();
        renderMain();

        state.flashcardIdx = 0;

      /* --- MÀN HÌNH 2: BẢNG CHỮ CÁI KANA & QUIZ --- */
      let kanaTab = "all"; // "all" | "hiragana" | "katakana" | "quiz"
      let kanaQuizMode = "both"; // "hiragana" | "katakana" | "both"
      let kanaQuizCurrent = null;

      function getKanaGroupStats(list, mode) {
        const validItems = list.filter(item => item[0] && item[1]);
        if (validItems.length === 0) return { learned: 0, total: 0, pct: 0 };
        let learned = 0;
        validItems.forEach(item => {
          const hDone = !!state.learnedKana[`hira-${item[0]}`];
          const kDone = !!state.learnedKana[`kata-${item[1]}`];
          if (mode === "hiragana" && hDone) learned++;
          else if (mode === "katakana" && kDone) learned++;
          else if (mode === "all" && hDone && kDone) learned++;
        });
        return {
          learned,
          total: validItems.length,
          pct: Math.round((learned / validItems.length) * 100)
        };
      }

      function toggleLearnedKana(event, key) {
        event.stopPropagation();
        if (state.learnedKana[key]) {
          delete state.learnedKana[key];
        } else {
          state.learnedKana[key] = true;
        }
        saveState();
        renderKanaView();
      }

      function renderKanaCell(item, mode, isYoon = false) {
        if (!item[0] || !item[1]) {
          return `<div class="kana-cell empty" aria-hidden="true"></div>`;
        }
        const [hira, kata, rom] = item;
        const displayChar = mode === "hiragana"
          ? hira
          : mode === "katakana"
            ? kata
            : `${hira} ${kata}`;
        const speakChar = mode === "katakana" ? kata : hira;
        const key = mode === "katakana" ? `kata-${kata}` : `hira-${hira}`;
        const isLearned = !!state.learnedKana[key];

        return `
          <div class="kana-cell ${isLearned ? "learned" : ""}"
              role="button"
              tabindex="0"
              style="${isYoon ? "min-height: 76px;" : ""}"
              onclick="speakJapanese('${speakChar}')"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();speakJapanese('${speakChar}');}"
              aria-label="${displayChar}, đọc là ${rom}">
            <button type="button"
                    class="kana-check-btn"
                    title="${isLearned ? "Đã thuộc" : "Đánh dấu đã thuộc"}"
                    aria-label="Đánh dấu ${displayChar} đã thuộc"
                    onclick="toggleLearnedKana(event, '${key}')">✓</button>
            <span class="kana-char jp-text">${displayChar}</span>
            <span class="kana-rom">${rom}</span>
          </div>
        `;
      }

      function renderKanaView() {
        mainEl.innerHTML = `
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px;">
            <div>
              <h2 class="serif-title" style="font-size: 1.45rem;">Bảng Chữ Cái Tiếng Nhật</h2>
              <p style="font-size: 0.88rem; color: var(--text-secondary);">Bấm vào thẻ để nghe phát âm · Bấm ✓ ở góc phải để lưu mức độ thuộc.</p>
            </div>
            <div class="sub-tabs" style="margin-bottom: 0; border: none;">
              <button class="sub-tab ${kanaTab === "all" ? "active" : ""}" onclick="kanaTab='all'; renderKanaView()">Hira + Kata</button>
              <button class="sub-tab ${kanaTab === "hiragana" ? "active" : ""}" onclick="kanaTab='hiragana'; renderKanaView()">Hiragana</button>
              <button class="sub-tab ${kanaTab === "katakana" ? "active" : ""}" onclick="kanaTab='katakana'; renderKanaView()">Katakana</button>
              <button class="sub-tab ${kanaTab === "quiz" ? "active" : ""}" onclick="kanaTab='quiz'; startKanaQuiz()">🎯 Quiz</button>
            </div>
          </div>
          <div id="kana-stage"></div>
        `;

        const stage = document.getElementById("kana-stage");
        if (kanaTab === "quiz") {
          renderKanaQuizUI(stage);
          return;
        }

        const mode = kanaTab;
        const basicStat = getKanaGroupStats(KANA_DATA.basic, mode);
        const dakutenStat = getKanaGroupStats(KANA_DATA.dakuten, mode);
        const yoonStat = getKanaGroupStats(KANA_DATA.yoon, mode);

        stage.innerHTML = `
          <div class="kana-section-head">
            <span class="kana-section-title">Âm cơ bản</span>
            <span class="kana-section-pct">· thuộc ${basicStat.pct}% (${basicStat.learned}/${basicStat.total})</span>
          </div>
          <div class="kana-grid">
            ${KANA_DATA.basic.map(item => renderKanaCell(item, mode, false)).join("")}
          </div>

          <div class="kana-section-head">
            <span class="kana-section-title">Âm đục &amp; bán đục</span>
            <span class="kana-section-pct">· thuộc ${dakutenStat.pct}% (${dakutenStat.learned}/${dakutenStat.total})</span>
          </div>
          <div class="kana-grid">
            ${KANA_DATA.dakuten.map(item => renderKanaCell(item, mode, false)).join("")}
          </div>

          <div class="kana-section-head">
            <span class="kana-section-title">Âm ghép</span>
            <span class="kana-section-pct">· thuộc ${yoonStat.pct}% (${yoonStat.learned}/${yoonStat.total})</span>
          </div>
          <div class="kana-grid yoon-grid">
            ${KANA_DATA.yoon.map(item => renderKanaCell(item, mode, true)).join("")}
          </div>
        `;
      }

      function startKanaQuiz() {
        const pool = [...KANA_DATA.basic, ...KANA_DATA.dakuten].filter(x => x[0]);
        const target = pool[Math.floor(Math.random() * pool.length)];
        const useKata = kanaQuizMode === "katakana" || (kanaQuizMode === "both" && Math.random() > 0.5);
        const char = useKata ? target[1] : target[0];
        const distractors = shuffleArray(pool.filter(x => x[2] !== target[2])).slice(0, 3);
        const options = shuffleArray([target[2], ...distractors.map(d => d[2])]);

        kanaQuizCurrent = { char, answer: target[2], options, answered: false };
        renderKanaView();
      }

      function renderKanaQuizUI(container) {
        if (!kanaQuizCurrent) {
          startKanaQuiz();
          return;
        }
        container.innerHTML = `
          <div style="max-width: 480px; margin: 0 auto; text-align: center;">
            <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 16px;">
              <button class="btn-secondary" style="${kanaQuizMode === "hiragana" ? "background:var(--indigo-primary);color:#fff;" : ""}" onclick="kanaQuizMode='hiragana'; startKanaQuiz()">Hiragana</button>
              <button class="btn-secondary" style="${kanaQuizMode === "katakana" ? "background:var(--indigo-primary);color:#fff;" : ""}" onclick="kanaQuizMode='katakana'; startKanaQuiz()">Katakana</button>
              <button class="btn-secondary" style="${kanaQuizMode === "both" ? "background:var(--indigo-primary);color:#fff;" : ""}" onclick="kanaQuizMode='both'; startKanaQuiz()">Cả hai</button>
            </div>

            <div class="vocab-card" style="padding: 28px; margin-bottom: 16px;">
              <span style="font-size: 0.85rem; color: var(--text-muted);">Chữ này đọc là gì?</span>
              <div class="jp-text" style="font-size: 4rem; font-weight: 700; margin: 8px 0;">${kanaQuizCurrent.char}</div>
              <div><button class="icon-btn" onclick="speakJapanese('${kanaQuizCurrent.char}')">🔊 Nghe âm thanh</button></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              ${kanaQuizCurrent.options.map(opt => `
                <button class="quiz-option" style="justify-content: center; font-weight: 700;" onclick="checkKanaAnswer(this, '${opt}')">${opt}</button>
              `).join("")}
            </div>
            <div id="kana-feedback" style="margin-top: 14px; text-align: left;"></div>
          </div>
        `;
      }

      function checkKanaAnswer(btn, chosen) {
        if (kanaQuizCurrent.answered) return;
        kanaQuizCurrent.answered = true;
        speakJapanese(kanaQuizCurrent.char);

        const isRight = chosen === kanaQuizCurrent.answer;
        recordQuizResult(isRight);

        document.querySelectorAll("#kana-stage .quiz-option").forEach(b => {
          b.disabled = true;
          if (b.textContent === kanaQuizCurrent.answer) b.classList.add("correct");
          else if (b === btn && !isRight) b.classList.add("wrong");
        });

        const tip = KANA_DATA.confusableTips[kanaQuizCurrent.char] || "";
        document.getElementById("kana-feedback").innerHTML = `
          <div style="padding: 12px; border-radius: 12px; background: ${isRight ? "var(--success-bg)" : "var(--error-bg)"};">
            <strong>${isRight ? "✓ Chính xác!" : `✗ Chưa đúng. Đáp án là "${kanaQuizCurrent.answer}".`}</strong>
            ${!isRight && tip ? `<p style="font-size: 0.88rem; margin-top: 4px;">💡 Mẹo nhớ: ${tip}</p>` : ""}
            <div style="margin-top: 10px;">
              <button class="btn-primary" onclick="startKanaQuiz()">Câu tiếp theo →</button>
            </div>
          </div>
        `;
      }

      /* --- MÀN HÌNH 3: CHI TIẾT BÀI HỌC (6 TAB) --- */
      function renderLessonView() {
        const lesson = LESSONS.find(l => l.n === state.currentLesson);
        if (!lesson) {
          mainEl.innerHTML = `<p>Bài học này đang được cập nhật.</p>`;
          return;
        }

        const isCompleted = state.completedLessons.includes(lesson.n);

        mainEl.innerHTML = `
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px;">
            <div>
              <span class="tag-pill">Bài ${lesson.n} · ${lesson.topic}</span>
              <h2 class="serif-title" style="font-size: 1.45rem; margin-top: 4px;">${lesson.title}</h2>
            </div>
            <button class="btn-secondary" onclick="toggleLessonComplete(${lesson.n})" style="${isCompleted ? "background: var(--success-bg); color: var(--success-color);" : ""}">
              ${isCompleted ? "✓ Đã hoàn thành Bài " + lesson.n : "Đánh dấu hoàn thành"}
            </button>
          </div>

          <!-- 6 Sub-tabs theo yêu cầu -->
          <div class="sub-tabs" role="tablist">
            <button class="sub-tab ${state.currentLessonTab === "vocab" ? "active" : ""}" onclick="setLessonTab('vocab')">1. Từ vựng (${lesson.vocab.length})</button>
            <button class="sub-tab ${state.currentLessonTab === "dialogue" ? "active" : ""}" onclick="setLessonTab('dialogue')">2. Mẫu câu & Hội thoại</button>
            <button class="sub-tab ${state.currentLessonTab === "grammar" ? "active" : ""}" onclick="setLessonTab('grammar')">3. Ngữ pháp (${lesson.patterns.length})</button>
            <button class="sub-tab ${state.currentLessonTab === "practice" ? "active" : ""}" onclick="setLessonTab('practice')">4. Luyện tập</button>
            <button class="sub-tab ${state.currentLessonTab === "ref" ? "active" : ""}" onclick="setLessonTab('ref')">5. Thông tin tham khảo</button>
            <button class="sub-tab ${state.currentLessonTab === "exam" ? "active" : ""}" onclick="setLessonTab('exam')">6. Kiểm tra & Ôn tập</button>
          </div>

          <div id="lesson-tab-body"></div>
        `;

        const body = document.getElementById("lesson-tab-body");
        switch (state.currentLessonTab) {
          case "vocab": renderLessonVocab(body, lesson); break;
          case "dialogue": renderLessonDialogue(body, lesson); break;
          case "grammar": renderLessonGrammar(body, lesson); break;
          case "practice": renderLessonPractice(body, lesson); break;
          case "ref": renderLessonRef(body, lesson); break;
          case "exam": renderLessonExam(body, lesson); break;
        }
      }

      function setLessonTab(tab) {
        state.currentLessonTab = tab;
        saveState();
        renderLessonView();
      }

      function toggleLessonComplete(n) {
        if (state.completedLessons.includes(n)) {
          state.completedLessons = state.completedLessons.filter(x => x !== n);
        } else {
          state.completedLessons.push(n);
        }
        saveState();
        renderNavigation();
        renderLessonView();
      }

      /* Tab 1: Từ vựng */
      function renderLessonVocab(container, lesson) {
        const types = ["all", ...new Set(lesson.vocab.map(v => v.type))];
        const filtered = state.vocabTypeFilter === "all"
          ? lesson.vocab
          : lesson.vocab.filter(v => v.type === state.vocabTypeFilter);

        container.innerHTML = `
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px;">
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <button class="btn-secondary" onclick="state.vocabViewMode = state.vocabViewMode === 'list' ? 'flashcard' : 'list'; renderLessonView()">
                ${state.vocabViewMode === "list" ? "🃏 Chế độ Flashcard" : "📋 Chế độ Danh sách"}
              </button>
              <button class="btn-secondary" onclick="state.showFurigana = !state.showFurigana; applyDisplayToggles(); renderLessonView()">
                ${state.showFurigana ? "👁️ Ẩn Furigana" : "👁️ Hiện Furigana"}
              </button>
              <button class="btn-secondary" onclick="state.showRomaji = !state.showRomaji; renderLessonView()">
                ${state.showRomaji ? "Aa Ẩn Romaji" : "Aa Hiện Romaji"}
              </button>
            </div>

            <select aria-label="Lọc theo từ loại" onchange="state.vocabTypeFilter = this.value; renderLessonView()" style="padding: 8px 12px; border-radius: 10px; background: var(--card-bg-elevated); border: 1px solid var(--card-border);">
              ${types.map(t => `<option value="${t}" ${state.vocabTypeFilter === t ? "selected" : ""}>${t === "all" ? "Tất cả từ loại" : t}</option>`).join("")}
            </select>
          </div>

          <div id="vocab-stage"></div>
        `;

        const stage = document.getElementById("vocab-stage");

        if (state.vocabViewMode === "flashcard") {
          const idx = Math.min(state.flashcardIdx, filtered.length - 1);
          const item = filtered[idx];
          const vKey = getVocabKey(lesson.n, item.jp);
          const isMastered = !!state.masteredVocab[vKey];

          stage.innerHTML = `
            <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Thẻ ${idx + 1} / ${filtered.length} (Bấm vào thẻ để lật)</div>
            <div class="flashcard-stage">
              <div class="flashcard-inner ${state.flashcardFlipped ? "flipped" : ""}" onclick="state.flashcardFlipped = !state.flashcardFlipped; this.classList.toggle('flipped')">
                <div class="flashcard-face">
                  <span class="tag-pill" style="margin-bottom: 12px;">${item.type}</span>
                  <div class="vocab-jp" style="font-size: 2rem;">${renderJpWithFurigana(item.jp, item.kanji)}</div>
                  ${state.showRomaji ? `<div class="vocab-romaji" style="margin-top: 6px;">${toRomaji(item.jp)}</div>` : ""}
                  <button class="icon-btn" style="margin-top: 14px;" onclick="event.stopPropagation(); speakJapanese('${item.jp.replace(/'/g, "\\'")}')" aria-label="Nghe phát âm">🔊 Nghe</button>
                </div>
                <div class="flashcard-face flashcard-back">
                  <div style="font-size: 1.35rem; font-weight: 700; margin-bottom: 8px;">${item.vi}</div>
                  <div class="jp-text" style="color: var(--text-secondary);">${item.kanji || item.jp} (${item.jp})</div>
                </div>
              </div>
            </div>
            <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
              <button class="btn-secondary" onclick="state.flashcardIdx = (state.flashcardIdx - 1 + ${filtered.length}) % ${filtered.length}; state.flashcardFlipped = false; renderLessonView()">← Trước</button>
              <button class="btn-secondary" style="${isMastered ? "background:var(--success-bg);color:var(--success-color);" : ""}" onclick="toggleMasteredVocab('${vKey}')">
                ${isMastered ? "✓ Đã thuộc" : "Đánh dấu đã thuộc"}
              </button>
              <button class="btn-primary" onclick="state.flashcardIdx = (state.flashcardIdx + 1) % ${filtered.length}; state.flashcardFlipped = false; renderLessonView()">Tiếp →</button>
            </div>
          `;
          return;
        }

        stage.innerHTML = `
          <div class="vocab-grid">
            ${filtered.map(v => {
              const vKey = getVocabKey(lesson.n, v.jp);
              const isMastered = !!state.masteredVocab[vKey];
              const box = state.leitnerBoxes[vKey] || 1;
              return `
                <div class="vocab-card ${isMastered ? "mastered" : ""}">
                  <div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 6px;">
                      <span class="tag-pill">${v.type} · Hộp ${box}</span>
                      <button class="icon-btn" style="padding: 4px 8px; min-height: 30px;" onclick="speakJapanese('${v.jp.replace(/'/g, "\\'")}')" aria-label="Nghe ${v.jp}">🔊</button>
                    </div>
                    <div class="vocab-jp" style="margin-top: 6px;">${renderJpWithFurigana(v.jp, v.kanji)}</div>
                    ${state.showRomaji ? `<div class="vocab-romaji">${toRomaji(v.jp)}</div>` : ""}
                  </div>
                  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-top: 6px;">
                    <div class="vocab-vi">${v.vi}</div>
                    <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.78rem; white-space: nowrap;" onclick="toggleMasteredVocab('${vKey}')">
                      ${isMastered ? "✓ Thuộc" : "Học"}
                    </button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      function toggleMasteredVocab(vKey) {
        if (state.masteredVocab[vKey]) {
          delete state.masteredVocab[vKey];
          state.leitnerBoxes[vKey] = 1;
        } else {
          state.masteredVocab[vKey] = true;
          state.leitnerBoxes[vKey] = 5;
        }
        saveState();
        renderLessonView();
      }

      /* Tab 2: Mẫu câu & Hội thoại */
      function renderLessonDialogue(container, lesson) {
        container.innerHTML = `
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;">
            <button class="btn-primary" onclick='speakDialogueSequence(${JSON.stringify(lesson.dialogue.lines).replace(/'/g, "&apos;")})'>
              ▶️ Nghe cả đoạn hội thoại
            </button>
            <button class="btn-secondary" onclick="state.showTranslation = !state.showTranslation; renderLessonView()">
              ${state.showTranslation ? "🇻🇳 Ẩn dịch tiếng Việt" : "🇻🇳 Hiện dịch tiếng Việt"}
            </button>
            <button class="btn-secondary" onclick="state.shadowingMode = !state.shadowingMode; renderLessonView()">
              ${state.shadowingMode ? "🗣️ Tắt che chữ (Shadowing)" : "🗣️ Bật chế độ Shadowing"}
            </button>
          </div>

          <h3 class="serif-title" style="font-size: 1.15rem; margin-bottom: 10px;">I. Mẫu câu (文型)</h3>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
            ${lesson.models.map(m => `
              <div class="vocab-card" style="flex-direction: row; align-items: center;">
                <div class="${state.shadowingMode ? "shadowing-blur" : ""}">
                  <div class="jp-text jp-line" style="font-weight: 700; font-size: 1.05rem;">${m.jp}</div>
                  ${state.showTranslation ? `<div style="font-size: 0.9rem; color: var(--text-secondary);">${m.vi}</div>` : ""}
                </div>
                <button class="icon-btn" onclick="speakJapanese('${m.jp.replace(/'/g, "\\'")}')" aria-label="Nghe mẫu câu">🔊</button>
              </div>
            `).join("")}
          </div>

          <h3 class="serif-title" style="font-size: 1.15rem; margin-bottom: 10px;">II. Ví dụ (例文)</h3>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px;">
            ${lesson.examples.map(ex => `
              <div class="vocab-card" style="flex-direction: row; align-items: center;">
                <div class="${state.shadowingMode ? "shadowing-blur" : ""}" style="white-space: pre-line;">
                  <div class="jp-text jp-line" style="font-weight: 600;">${ex.jp}</div>
                  ${state.showTranslation ? `<div style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 4px;">${ex.vi}</div>` : ""}
                </div>
                <button class="icon-btn" onclick="speakJapanese('${ex.jp.replace(/\n/g, " ").replace(/'/g, "\\'")}')" aria-label="Nghe ví dụ">🔊</button>
              </div>
            `).join("")}
          </div>

          <h3 class="serif-title" style="font-size: 1.15rem; margin-bottom: 12px;">III. Hội thoại: ${lesson.dialogue.title}</h3>
          <div class="chat-list ${state.shadowingMode ? "shadowing-blur" : ""}">
            ${lesson.dialogue.lines.map(line => {
              const charInfo = CHARACTERS[line.who] || { abbr: line.who.slice(0, 2).toUpperCase(), color: "#264373" };
              return `
                <div class="chat-row">
                  <div class="avatar-circle" style="background: ${charInfo.color};" title="${line.who}">${charInfo.abbr}</div>
                  <div class="chat-bubble">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                      <strong style="font-size: 0.85rem; color: var(--indigo-primary);">${line.who}</strong>
                      <button class="icon-btn" style="padding: 3px 8px; min-height: 28px;" onclick="speakJapanese('${line.jp.replace(/\n/g, " ").replace(/'/g, "\\'")}', '${line.who}')" aria-label="Nghe lời thoại của ${line.who}">🔊</button>
                    </div>
                    <div class="jp-text jp-line" style="font-size: 1.05rem; font-weight: 600; white-space: pre-line;">${line.jp}</div>
                    ${state.showTranslation ? `<div style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 6px; white-space: pre-line;">${line.vi}</div>` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      /* Tab 3: Ngữ pháp */
      function renderLessonGrammar(container, lesson) {
        container.innerHTML = lesson.patterns.map((p, idx) => `
          <div class="grammar-card">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px;">
              <div>
                <span class="tag-pill">Điểm ${idx + 1}</span>
                <div class="grammar-formula jp-text" style="margin-top: 4px;">${p.formula}</div>
                <div style="font-weight: 600; color: var(--text-primary);">${p.vi}</div>
              </div>
              <button class="btn-primary" onclick="practiceSpecificPattern('${p.id}')">🎯 Luyện điểm này</button>
            </div>

            <p style="font-size: 0.94rem; color: var(--text-secondary); margin-bottom: 12px;">${p.explain}</p>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${p.examples.map(ex => `
                <div style="padding: 10px 12px; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                  <div>
                    <div class="jp-text" style="font-weight: 600;">${ex.jp}</div>
                    <div style="font-size: 0.86rem; color: var(--text-secondary);">${ex.vi}</div>
                  </div>
                  <button class="icon-btn" onclick="speakJapanese('${ex.jp.replace(/'/g, "\\'")}')" aria-label="Nghe ví dụ">🔊</button>
                </div>
              `).join("")}
            </div>

            ${p.tips ? `<div style="margin-top: 10px; font-size: 0.85rem; color: var(--indigo-primary);">💡 <strong>Lưu ý:</strong> ${p.tips}</div>` : ""}
          </div>
        `).join("");
      }

      /* Tab 4 & 6: Engine Luyện tập & Kiểm tra */
      let activeQuiz = {
        questions: [],
        index: 0,
        score: 0,
        selectedTokens: [],
        answered: false,
        title: ""
      };

      function practiceSpecificPattern(patternId) {
        state.currentLessonTab = "practice";
        activeQuiz = {
          questions: generatePracticeQuestions(state.currentLesson, 6, patternId),
          index: 0,
          score: 0,
          selectedTokens: [],
          answered: false,
          title: `Luyện điểm ngữ pháp ${patternId}`
        };
        renderLessonView();
      }

      function renderLessonPractice(container, lesson) {
        if (activeQuiz.questions.length === 0) {
          activeQuiz = {
            questions: generatePracticeQuestions(lesson.n, 8),
            index: 0,
            score: 0,
            selectedTokens: [],
            answered: false,
            title: `Luyện tập tổng hợp Bài ${lesson.n}`
          };
        }
        renderQuizRunner(container, lesson.n, false);
      }

      function renderLessonExam(container, lesson) {
        container.innerHTML = `
          <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px;">
            <button class="btn-primary" onclick="startExam(${lesson.n}, 12, 'Kiểm tra cuối Bài ${lesson.n}')">📝 Kiểm tra cuối Bài ${lesson.n} (12 câu)</button>
            <button class="btn-secondary" onclick="startExam(${lesson.n}, 15, 'Ôn tập tích lũy Bài 1 → ${lesson.n}')">🏔️ Ôn tập tích lũy Bài 1 → ${lesson.n} (15 câu)</button>
          </div>
          <div id="exam-stage"></div>
        `;
        if (activeQuiz.questions.length > 0) {
          renderQuizRunner(document.getElementById("exam-stage"), lesson.n, true);
        }
      }

      function startExam(maxLesson, count, title) {
        activeQuiz = {
          questions: generatePracticeQuestions(maxLesson, count),
          index: 0,
          score: 0,
          selectedTokens: [],
          answered: false,
          title
        };
        renderLessonView();
      }

      function renderQuizRunner(container, lessonN, isExam) {
        if (activeQuiz.index >= activeQuiz.questions.length) {
          const pct = Math.round((activeQuiz.score / activeQuiz.questions.length) * 100);
          if (isExam && pct >= 80 && !state.completedLessons.includes(lessonN)) {
            state.completedLessons.push(lessonN);
            saveState();
            renderNavigation();
          }
          container.innerHTML = `
            <div class="vocab-card" style="text-align: center; padding: 28px; max-width: 500px; margin: 0 auto;">
              <div style="font-size: 2.5rem; margin-bottom: 8px;">${pct >= 80 ? "🎉" : "💪"}</div>
              <h3 class="serif-title" style="font-size: 1.3rem;">Hoàn thành: ${activeQuiz.title}</h3>
              <p style="font-size: 1.1rem; margin: 10px 0;">Điểm số: <strong>${activeQuiz.score} / ${activeQuiz.questions.length}</strong> (${pct}%)</p>
              ${isExam && pct >= 80 ? `<p style="color: var(--success-color); font-weight: 600;">✓ Đã tự động đánh dấu hoàn thành Bài ${lessonN}!</p>` : ""}
              <div style="margin-top: 16px;">
                <button class="btn-primary" onclick="activeQuiz.questions=[]; renderLessonView()">Làm lượt mới</button>
              </div>
            </div>
          `;
          return;
        }

        const q = activeQuiz.questions[activeQuiz.index];
        if (q.autoPlay && !activeQuiz.answered) {
          setTimeout(() => speakJapanese(q.audioText), 200);
          q.autoPlay = false;
        }

        container.innerHTML = `
          <div style="max-width: 620px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.88rem; color: var(--text-secondary);">
              <span><strong>${activeQuiz.title}</strong></span>
              <span>Câu ${activeQuiz.index + 1} / ${activeQuiz.questions.length} · Chuỗi đúng: 🔥 ${state.quizStats.streak}</span>
            </div>

            <div class="vocab-card" style="padding: 20px; margin-bottom: 14px;">
              <div style="white-space: pre-line; font-size: 1.05rem; font-weight: 600; margin-bottom: 10px;">${q.prompt}</div>
              ${q.audioText ? `<div><button class="icon-btn" onclick="speakJapanese('${q.audioText.replace(/'/g, "\\'")}')">🔊 Nghe lại</button></div>` : ""}
            </div>

            <div id="quiz-interaction-area"></div>
            <div id="quiz-feedback-area" style="margin-top: 12px;"></div>
          </div>
        `;

        const area = document.getElementById("quiz-interaction-area");

        if (q.type === "choice") {
          area.innerHTML = q.options.map(opt => `
            <button class="quiz-option jp-text" onclick='submitChoiceAnswer(this, ${JSON.stringify(opt).replace(/'/g, "&apos;")})'>
              <span>${opt}</span>
            </button>
          `).join("");
        } else if (q.type === "reorder") {
          area.innerHTML = `
            <div class="word-bank" id="selected-words-bank">
              ${activeQuiz.selectedTokens.map((t, idx) => `
                <button class="word-chip jp-text" onclick="removeReorderToken(${idx})">${t}</button>
              `).join("")}
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;">
              ${q.tokens.map((t, idx) => {
                const usedCount = activeQuiz.selectedTokens.filter(x => x === t).length;
                const totalCount = q.tokens.filter(x => x === t).length;
                const disabled = usedCount >= totalCount;
                return `<button class="btn-secondary jp-text" ${disabled ? "disabled style='opacity:0.4;'" : ""} onclick='addReorderToken(${JSON.stringify(t).replace(/'/g, "&apos;")})'>${t}</button>`;
              }).join("")}
            </div>
            <button class="btn-primary" ${activeQuiz.selectedTokens.length === 0 ? "disabled" : ""} onclick="submitReorderAnswer()">Kiểm tra câu</button>
          `;
        }
      }

      function addReorderToken(token) {
        if (activeQuiz.answered) return;
        activeQuiz.selectedTokens.push(token);
        renderLessonView();
      }

      function removeReorderToken(idx) {
        if (activeQuiz.answered) return;
        activeQuiz.selectedTokens.splice(idx, 1);
        renderLessonView();
      }

      function submitReorderAnswer() {
        if (activeQuiz.answered) return;
        const q = activeQuiz.questions[activeQuiz.index];
        const userSentence = activeQuiz.selectedTokens.join(" ");
        const isRight = userSentence === q.answerText;
        finalizeQuestion(isRight, q);
      }

      function submitChoiceAnswer(btn, chosen) {
        if (activeQuiz.answered) return;
        const q = activeQuiz.questions[activeQuiz.index];
        const isRight = chosen === q.answer;

        document.querySelectorAll("#quiz-interaction-area .quiz-option").forEach(b => {
          b.disabled = true;
          const txt = b.innerText.trim();
          if (txt === q.answer) b.classList.add("correct");
          else if (b === btn && !isRight) b.classList.add("wrong");
        });

        finalizeQuestion(isRight, q);
      }

      function finalizeQuestion(isRight, q) {
        activeQuiz.answered = true;
        if (isRight) activeQuiz.score++;
        if (q.vocabKey) updateLeitner(q.vocabKey, isRight);
        recordQuizResult(isRight);

        document.getElementById("quiz-feedback-area").innerHTML = `
          <div style="padding: 14px; border-radius: 14px; background: ${isRight ? "var(--success-bg)" : "var(--error-bg)"}; border: 1px solid ${isRight ? "var(--success-color)" : "var(--error-color)"};">
            <strong>${isRight ? "✓ Chính xác!" : `✗ Chưa đúng. Đáp án đúng là: ${q.answer || q.answerText}`}</strong>
            <p style="font-size: 0.9rem; margin-top: 6px;">${q.explain}</p>
            <div style="margin-top: 12px;">
              <button class="btn-primary" onclick="activeQuiz.index++; activeQuiz.answered=false; activeQuiz.selectedTokens=[]; renderLessonView()">Câu tiếp theo →</button>
            </div>
          </div>
        `;
      }

      function recordQuizResult(isRight) {
        state.quizStats.total++;
        if (isRight) {
          state.quizStats.correct++;
          state.quizStats.streak++;
          // Trả lời đúng liên tiếp 5 câu -> tuyết rơi dày trong 4 giây
          if (state.quizStats.streak > 0 && state.quizStats.streak % 5 === 0) {
            triggerSnowBurst();
          }
        } else {
          state.quizStats.streak = 0;
        }
        saveState();
      }

      /* ==========================================================================
        MODULE 7: NỀN NÚI PARALLAX, SAO ĐÊM & TUYẾT RƠI CANVAS 3 LỚP
        ========================================================================== */
      function initStarsAndParallax() {
        const starsLayer = document.getElementById("stars-layer");
        for (let i = 0; i < 80; i++) {
          const star = document.createElement("div");
          star.className = "star";
          const size = (Math.random() * 2 + 1).toFixed(1);
          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          star.style.left = `${Math.random() * 100}%`;
          star.style.top = `${Math.random() * 65}%`;
          star.style.setProperty("--dur", `${(Math.random() * 3 + 2.5).toFixed(1)}s`);
          starsLayer.appendChild(star);
        }

        const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (prefersReduced) return;

        const layers = document.querySelectorAll(".parallax-layer");
        window.addEventListener("mousemove", e => {
          const nx = (e.clientX / window.innerWidth - 0.5) * 2;
          const ny = (e.clientY / window.innerHeight - 0.5) * 2;
          layers.forEach(layer => {
            const depth = parseFloat(layer.dataset.depth || 0.02);
            layer.style.transform = `translate3d(${-nx * depth * 450}px, ${-ny * depth * 220}px, 0)`;
          });
        }, { passive: true });
      }

      // Hệ thống tuyết rơi Canvas
      const snowCanvas = document.getElementById("snow-canvas");
      const snowCtx = snowCanvas.getContext("2d");
      let flakes = [];
      let snowBurstMultiplier = 1;
      let lastFrameTime = performance.now();
      let lowFpsFrames = 0;

      function triggerSnowBurst() {
        if (state.snowMode === "off") return;
        snowBurstMultiplier = 2.2;
        initSnowflakes();
        setTimeout(() => {
          snowBurstMultiplier = 1;
          initSnowflakes();
        }, 4500);
      }

      function getTargetFlakeCount() {
        if (state.snowMode === "off") return 0;
        const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (prefersReduced) return 18;

        const isMobile = window.innerWidth < 768;
        const base = isMobile ? 70 : 140;
        const modeMult = state.snowMode === "light" ? 0.5 : state.snowMode === "heavy" ? 1.6 : 1;
        return Math.round(base * modeMult * snowBurstMultiplier);
      }

      function resizeSnowCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        snowCanvas.width = window.innerWidth * dpr;
        snowCanvas.height = window.innerHeight * dpr;
        snowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function initSnowflakes() {
        const count = getTargetFlakeCount();
        flakes = [];
        for (let i = 0; i < count; i++) {
          // 3 lớp độ sâu: 0 = xa, 1 = giữa, 2 = gần
          const layer = i % 3;
          flakes.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: layer === 0 ? 1.3 + Math.random() : layer === 1 ? 2.4 + Math.random() * 1.2 : 3.8 + Math.random() * 1.6,
            vy: (layer === 0 ? 0.35 : layer === 1 ? 0.75 : 1.3) + Math.random() * 0.4,
            amp: (layer + 1) * 0.45 + Math.random() * 0.5,
            phase: Math.random() * Math.PI * 2,
            alpha: layer === 0 ? 0.35 : layer === 1 ? 0.65 : 0.85,
            layer
          });
        }
      }

      function animateSnow(now) {
        requestAnimationFrame(animateSnow);
        if (document.hidden || state.snowMode === "off") {
          snowCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          return;
        }

        // Giám sát FPS, tự giảm mật độ nếu < 40 FPS
        const dt = now - lastFrameTime;
        lastFrameTime = now;
        if (dt > 26 && flakes.length > 35) {
          lowFpsFrames++;
          if (lowFpsFrames > 25) {
            flakes.splice(0, Math.floor(flakes.length * 0.25));
            lowFpsFrames = 0;
          }
        } else {
          lowFpsFrames = 0;
        }

        const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const wind = prefersReduced ? 0 : Math.sin(now * 0.00025) * 0.65;

        snowCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        const w = window.innerWidth;
        const h = window.innerHeight;

        for (let i = 0; i < flakes.length; i++) {
          const f = flakes[i];
          if (!prefersReduced) {
            f.phase += 0.015;
            f.y += f.vy * (snowBurstMultiplier > 1 ? 1.5 : 1);
            f.x += Math.sin(f.phase) * f.amp + wind * (f.layer + 1) * 0.35;
          }

          if (f.y > h + 10) { f.y = -10; f.x = Math.random() * w; }
          if (f.x > w + 10) f.x = -10;
          if (f.x < -10) f.x = w + 10;

          snowCtx.beginPath();
          snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          snowCtx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
          snowCtx.fill();
        }
      }

      /* ==========================================================================
        MODULE 8: KHỞI TẠO SỰ KIỆN & ĐIỀU KHIỂN CHUNG
        ========================================================================== */
      function applyTheme() {
        document.documentElement.setAttribute("data-theme", state.theme);
        document.getElementById("theme-icon").textContent = state.theme === "dark" ? "🌙" : "🌅";
      }

      function applyDisplayToggles() {
        document.body.classList.toggle("hide-furigana", !state.showFurigana);
        const labels = { off: "Tắt", light: "Nhẹ", medium: "Vừa", heavy: "Dày" };
        document.getElementById("snow-mode-label").textContent = labels[state.snowMode] || "Vừa";
      }

      window.addEventListener("DOMContentLoaded", () => {
        loadState();
        applyTheme();
        applyDisplayToggles();
        initVoices();
        initStarsAndParallax();
        resizeSnowCanvas();
        initSnowflakes();
        requestAnimationFrame(animateSnow);

        renderNavigation();
        renderMain();

        // Sự kiện đổi theme
        document.getElementById("theme-toggle-btn").addEventListener("click", () => {
          state.theme = state.theme === "light" ? "dark" : "light";
          applyTheme();
          saveState();
        });

        // Sự kiện đổi mật độ tuyết
        document.getElementById("snow-toggle-btn").addEventListener("click", () => {
          const order = ["light", "medium", "heavy", "off"];
          state.snowMode = order[(order.indexOf(state.snowMode) + 1) % order.length];
          applyDisplayToggles();
          initSnowflakes();
          saveState();
        });

        // Điều hướng view
        document.querySelectorAll("[data-view]").forEach(btn => {
          btn.addEventListener("click", () => switchView(btn.getAttribute("data-view")));
        });

        // Modal chọn bài trên Mobile
        document.getElementById("mob-lessons-btn").addEventListener("click", () => {
          document.getElementById("mobile-lesson-modal").classList.add("open");
        });
        document.getElementById("close-lesson-modal").addEventListener("click", () => {
          document.getElementById("mobile-lesson-modal").classList.remove("open");
        });

        // Tìm kiếm toàn cục
        document.getElementById("global-search-input").addEventListener("input", e => {
          searchQuery = e.target.value;
          if (searchQuery.trim()) {
            state.currentView = "search";
            renderNavigation();
            renderSearchView();
          } else {
            switchView("lesson");
          }
        });

        window.addEventListener("resize", () => {
          resizeSnowCanvas();
          initSnowflakes();
        });
      });
    </script>
  </body>
  </html>
